<form method="post" action="{% url 'eliminar_pedido' pedido.idPedido %}">
    {% csrf_token %}
    <p>¿Estás seguro de que deseas eliminar este pedido?</p>
    <input type="submit" value="Eliminar">
    <button type="button" onclick="goBack()">Volver</button>
</form>

<script>
    function goBack() {
        window.history.back();
    }
</script>
</form>
