<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="hola" id="bring" onchange="lafuncionnofunciona()">
        <option value="seleccione">Seleccione la región</option>
    </select>
    <select name="chao" id="brought">
        <option value="selec">Seleccione comuna</option>
    </select>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <script src="../javascript/crearusuario.js"></script>
    <script src="../javascript/carrito.js"></script>
    <script>
        

        $(document).ready(function(){
            $.get("../javascript/comunas.json", 
            function(data){
                $.each(data.regiones,function(i,item){
                    $("#bring").append("<option value='"+item.region+"'>"+item.region+"</option>");
                });
            });
            });

        
        function lafuncionnofunciona(){
            var comuna;
            document.getElementById("brought").innerHTML = "<option value='selec'>Seleccione comuna</option>";
            $(document).ready(function(){
            $.get("../javascript/comunas.json", 
            function(data){
                $.each(data.regiones,function(i,item){
                    if(document.getElementById('bring').value==item.region){
                        comuna=item.comunas;
                        for(var i = 0;i<comuna.length;i++){
                            $("#brought").append("<option value='"+comuna[i]+"'>"+comuna[i]+"</option>");
                        }
                    }
                });
            });
            });
        }      
        
    </script>
</body>
</html>
