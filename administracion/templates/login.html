{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso de Sesión para Administradores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <a href="{% url 'index' %}">Volver</a>
    <form action="" method="POST">
        {% csrf_token %}
        <div class="row" style="padding-top: 5%; padding-right: 25%; padding-left: 25%; padding-bottom: 1%;">
            <label for="user">
                Ingrese el Usuario:
            </label>
            <input type="text" name="user" id="" placeholder="Usuario">
        </div>
        <div class="row" style="padding-left: 25%; padding-right: 25%;">
            <label for="password">
                Ingrese la contraseña:
            </label>
            <input type="password" name="password" id="" placeholder="Ingrese la Contraseña">
        </div>
        <div class="row" style="padding-top: 1%; padding-right: 40%; padding-left: 40%; padding-bottom: 2%; justify-content: center;">
            <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
        </div>
        <span>
            {% if fallido %}
                {{fallido}}
            {% endif %}
        </span>
    </form>
</body>
</html>
