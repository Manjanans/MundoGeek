{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuarios del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    {% if messages %}  
    <ul>   
        {% for message in messages %}  
            <li>{{ message }}</li>  
            {% endfor %}  
    </ul>   
    {% endif %}  
    <a href="{% url 'adminIndex' %}">Volver</a>
    <div style="padding-top: 5%;   margin-left: 15%; margin-right: 15%;">
        <form action="{% url 'editar_usuarios' usser.username %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3 align-items-center">
                <label for="Usuario">Nombre de usuario:</label>
                <input type="text" name="usuario" value="{{usser.username}}" readonly>
            </div>
            <div class="row g-3 align-items-center">
                <label for="nombre">Nombre de la persona:</label>
                <input type="text" name="nombre" value="{{usser.first_name}}">
            </div>
            <div class="row g-3 align-items-center">
                <label for="apellido">Apellido de la persona:</label>
                <input type="text" name="apellido" value="{{usser.last_name}}">
            </div>
            <div class="row g-3 align-items-center">
                <label for="email">Email de la persona:</label>
                <input type="text" name="email" value="{{usser.email}}">
            </div>
            <div class="row g-3 align-items-center">
                <label for="contrasenia">Contraseña de la persona:</label>
                <input type="password" name="contrasenia" value="Contraseña nueva 12345">
            </div>
            <div class="d-flex justify-content-center my-3">
                <button class="btn btn-primary" type="submit">Editar</button>
            </div>  
        </form>
    </div>
    
</body>
</html>
