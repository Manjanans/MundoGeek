{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Usuarios al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    {% if messages %}  
    <ul>   
        {% for message in messages %}  
            <li>{{ message }}</li>  
            {% endfor %}  
    </ul>   
    {% endif %}  
    <a href="{% url 'adminIndex' %}">Volver</a>
    <div style="padding-top: 5%;   margin-left: 15%; margin-right: 15%;">
        <form action="{% url 'agregar_usuarios' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
             <table>  
                {% for dato in form %}
                 <tr> 
                    <td>{{dato.label}}</td>
                    <td>{{dato}}</td>
                {% endfor %} 
                <tr>
                    <td></td>
                </tr>
                                
             </table>
             <center>
                <input type="submit" name="submit" value="Registrar Usuario" />
            </center>  
        </form>
    </div>
    
</body>
</html>
