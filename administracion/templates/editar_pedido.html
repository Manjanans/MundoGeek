{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar el Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="{% static 'javascript/regiones.js' %}"></script>
</head>
<body onload="agregarRegionesAlSelect()">
    <a href="{% url 'adminIndex' %}">Volver</a>
    <form method="post" action="{% url 'editar_pedido' pedido.idPedido %}">
        {% csrf_token %}
        <div class="row g-2 my-1" id="formato-form">
            <div class="col-md-6">
                <label for="nombre" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombre" name = "name" onkeyup="verificarLargoNombre()" value="{{pedido.nombres}}">
                <span id="invalid-name" class="err"></span>
            </div>
            <div class="col-md-6">
                <label for="apellido" class="form-label">Apellido Paterno</label>
                <input type="text" class="form-control" id="apellido" name = "surname" onkeyup="verificarApellidoCliente()" value="{{pedido.apellidos}}">
                <span id="invalid-lastname" class="err"></span>
            </div>
        </div>
        <div class="row g-2 my-1" id="formato-form">
            <div class="col-md-6">
                <label for="rut" class="form-label">Ingresa el rut (sin puntos, guión ni dígito verificador)</label>
                <input type="text" class="form-control" id="rut" name = "rut" onkeyup="verificarRutdelCliente()" value="{{pedido.rut}}">
                <span id="invalid-run" class="err"></span>
            </div>
            <div class="col-md-6">
                <label for="telefono" class="form-label">Ingresa el número de teléfono</label>
                +56 9<input type="number" class="form-control" id="telefono" name = "telefono" onkeyup="verificarTelefonodelCliente()" value="{{pedido.telefono}}">
                <span id="invalid-fono" class="err"></span>
            </div>
        </div>
        <div class="row my-1" id="formato-form">
            <div class="col-md-6">
                <label for="regiones">Region:</label>
                <select name="regiones" class="form-select" id="regiones" name = "regiones" onchange="cambioDeComunaXRegion()" value="{{pedido.region}}">
                    <option value="seleccion">Seleccione la región</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="comuna">Comuna:</label>
                <select name="comuna" class="form-select" id="comuna" name = "comuna" value="{{pedido.comuna}}">
                    <option value="comuna">Seleccione la comuna</option>
                </select>
            </div>
        </div>

        <div class="d-flex flex-row justify-content-center my-1">
            <div class="col-10">
                <label for="direccion" class="form-label">Ingresa la dirección</label>
                <input type="text" class="form-control" id="direccion" name = "direccion"
                    aria-describedby="inputGroupPrepend" onkeyup="verificarDirecciondelCliente()" value="{{pedido.direccion}}">
                <span id="invalid-direccion" class="err">
                    {% if mensaje %}
                        {{mensaje}}
                    {% endif %}
                </span>
            </div>
        </div>
        
        <div class="d-flex justify-content-center my-3">
            <button class="btn btn-primary" type="submit">Editar</button>
        </div>
    </form>
    
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
    <script src="{% static 'javascript/crearusuario.js' %}"></script>
    <script src="{% static 'javascript/comunas.js' %}"></script> 
    </form>
</body>
</html>
