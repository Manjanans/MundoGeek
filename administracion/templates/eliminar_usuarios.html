<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Usuario de la Base de Datos</title>
</head>
<body>
    <form method="post" action="">
        {% csrf_token %}
        <p>¿Estás seguro de que deseas eliminar este usuario? {{usser.username}}</p>
        <input type="submit" value="Eliminar">
        <button type="button" onclick="goBack()">Volver</button>
    </form>
    
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
    </form>
</body>
</html>
