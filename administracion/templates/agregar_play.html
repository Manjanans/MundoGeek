{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Juegos de Switch al Catalogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div style="padding-top: 5%;   margin-left: 15%; margin-right: 15%;">
        <form action="{% url 'agregar_play' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-3 align-items-center">
                {{form.as_p}}
            </div>
            <div class="row g-3 align-items-center">
                <label for="descripcion">Descripción:</label>
                <textarea name="descripcion" id="des" cols="30" rows="5"></textarea>
            </div>
            <div class="row g-3 align-items-center">
                <label for="precio">Precio:</label>
                <input type="number" placeholder="99999" name="precio">
            </div>
            <div class="row g-3 align-items-center">
                <label for="inventario">Cantidad de Stock</label>
                <input type="text" placeholder="99999" name="inventario">
            </div>
            <div class="d-flex justify-content-center my-3">
                <button class="btn btn-primary" type="submit">Agregar</button>
            </div>
        </form>
    </div>
    
</body>
</html>
